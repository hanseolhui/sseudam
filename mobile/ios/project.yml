name: Sseudam
options:
  bundleIdPrefix: kr.sseudam
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ko
settings:
  base:
    DEVELOPMENT_TEAM: 967DUR6926
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "14"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Sseudam:
    type: application
    platform: iOS
    sources: [Sseudam, Shared]
    dependencies:
      - target: SseudamWidgets
        embed: true
      - target: SseudamWatch
        embed: true
    entitlements:
      path: Sseudam/Sseudam.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.kr.sseudam.app]
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.kr.sseudam.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.sseudam.app
        PRODUCT_NAME: Sseudam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Sseudam/Info.plist
    info:
      path: Sseudam/Info.plist
      properties:
        CFBundleDisplayName: 쓰담
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [kr.sseudam.app.refresh]
        NSMicrophoneUsageDescription: 수업 중 학생 관찰 내용을 녹음하기 위해 마이크를 사용합니다.
        NSSpeechRecognitionUsageDescription: 녹음한 관찰 내용을 아이폰 안에서 글자로 바꾸기 위해 받아쓰기를 사용합니다. 소리는 기기 밖으로 나가지 않습니다.
        NSFaceIDUsageDescription: 앱 잠금을 켜면 학생 기록을 열 때 Face ID로 본인을 확인합니다.
        NSCameraUsageDescription: 컴퓨터의 쓰담과 연결할 때 QR 코드를 찍기 위해 카메라를 사용합니다.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: kr.sseudam.app
            CFBundleURLSchemes: [sseudam, seteuk]
        # 음성 메모 등 다른 앱에서 녹음 → 공유 → 쓰담
        CFBundleDocumentTypes:
          - CFBundleTypeName: 녹음
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, com.apple.m4a-audio, public.mpeg-4-audio, public.mp3, com.microsoft.waveform-audio]
        LSSupportsOpeningDocumentsInPlace: false
        NSUbiquitousContainers:
          iCloud.kr.sseudam.app:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: 쓰담
            NSUbiquitousContainerSupportedFolderLevels: None

  # 잠금 화면 위젯 + 제어 센터 컨트롤 (iOS 18 컨트롤은 @available로 분기)
  SseudamWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources: [SseudamWidgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.sseudam.app.widgets
        PRODUCT_NAME: SseudamWidgets
        INFOPLIST_FILE: SseudamWidgets/Info.plist
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        SKIP_INSTALL: YES
    info:
      path: SseudamWidgets/Info.plist
      properties:
        CFBundleDisplayName: 쓰담
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # 애플워치 앱 (단일 타깃 watchOS 앱, 아이폰 앱에 포함)
  SseudamWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [SseudamWatch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.sseudam.app.watchkitapp
        PRODUCT_NAME: SseudamWatch
        INFOPLIST_FILE: SseudamWatch/Info.plist
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
    info:
      path: SseudamWatch/Info.plist
      properties:
        CFBundleDisplayName: 쓰담
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: kr.sseudam.app
        NSMicrophoneUsageDescription: 수업 중 학생 관찰 내용을 녹음하기 위해 마이크를 사용합니다.
