# 마이크로소프트 스토어(MSIX)판 만들기 + 진짜 윈도우에 시험 설치.
# - 파이썬 · Whisper 는 릴리스 설치 파일에서, 쓰담 코드와 실행기는 이 저장소에서, 내장 AI 엔진 · ffmpeg 는 묶음 안에 넣음
# - 결과: 서명 안 된 .msix (스토어가 서명해 줌) → 파트너 센터에 올림
# - 시험: 같은 묶음을 시험용 인증서로 서명해서 설치 → 실행 → 핵심 기능 확인
# 스토어 이름 · 게시자는 저장소 변수 MSIX_NAME · MSIX_PUBLISHER · MSIX_PUBLISHER_NAME (파트너 센터 '제품 ID' 화면 값)
name: windows-msix
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "검증할 릴리스 태그 (draft도 가능, 비우면 최신 공개 릴리스)"
        required: false
        type: string
      source_sha:
        description: "검증할 소스의 전체 commit SHA (draft 시험은 필수)"
        required: false
        type: string
      installer_sha256:
        description: "Sseudam-Setup.exe SHA256 (draft 시험은 필수)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  msix:
    runs-on: windows-latest
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      MSIX_NAME: ${{ vars.MSIX_NAME || 'SeoriArts.Sseudam' }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=SeoriArts' }}
      MSIX_PUBLISHER_NAME: ${{ vars.MSIX_PUBLISHER_NAME || '서리아트' }}
      FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-essentials_build.zip
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      REQUESTED_TAG: ${{ github.event.inputs.tag }}
      EXPECTED_SOURCE_SHA: ${{ github.event.inputs.source_sha }}
      VALIDATION_SOURCE_SHA: ${{ github.sha }}
      EXPECTED_INSTALLER_SHA256: ${{ github.event.inputs.installer_sha256 }}
    steps:
      - name: 공개 또는 draft 릴리스와 검증 소스 지정
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:REQUESTED_TAG -and $env:REQUESTED_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "릴리스 태그 형식이 올바르지 않음" }
          if ($env:EXPECTED_SOURCE_SHA -and $env:EXPECTED_SOURCE_SHA -notmatch '^[0-9a-fA-F]{40}$') { throw "전체 소스 SHA가 필요함" }
          if ($env:EXPECTED_INSTALLER_SHA256 -and $env:EXPECTED_INSTALLER_SHA256 -notmatch '^[0-9a-fA-F]{64}$') { throw "설치 파일 SHA256 형식이 올바르지 않음" }
          $releaseArgs = @("release", "view", "--repo", $env:GITHUB_REPOSITORY, "--json", "tagName,isDraft,targetCommitish,url")
          if ($env:REQUESTED_TAG) { $releaseArgs += $env:REQUESTED_TAG }
          $raw = & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw "릴리스 정보를 읽지 못함" }
          $release = $raw | ConvertFrom-Json
          if ($release.tagName -notmatch '^v\d+\.\d+\.\d+$') { throw "릴리스 태그 형식이 올바르지 않음" }
          if ($release.isDraft -and (-not $env:EXPECTED_SOURCE_SHA -or -not $env:EXPECTED_INSTALLER_SHA256)) {
            throw "draft 검증은 source_sha와 installer_sha256을 모두 지정해야 함"
          }
          $source = if ($env:EXPECTED_SOURCE_SHA) { $env:EXPECTED_SOURCE_SHA } else { $release.tagName }
          "source=$source" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "RELEASE_TAG=$($release.tagName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $release | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\release-verification.json" -Encoding utf8

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.source }}
          persist-credentials: false

      # 앱 소스는 릴리스 SHA에 고정하고, 시험 도구는 이번 workflow commit을 사용한다.
      # 캡처/검증 도구만 수정했을 때 이미 만든 릴리스 태그를 바꾸지 않기 위함이다.
      - name: 현재 검증 도구 가져오기
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ci-validation
          sparse-checkout: tools
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Windows Edge 화면 검증 도구 준비
        run: python -m pip install playwright

      - name: 소스 SHA와 릴리스 버전 확인
        shell: pwsh
        run: |
          @'
          import ast, json, os, pathlib, re, subprocess
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          expected = os.environ.get("EXPECTED_SOURCE_SHA", "")
          assert not expected or sha == expected.lower(), "Source SHA mismatch"
          release = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "release-verification.json").read_text(encoding="utf-8-sig"))
          target = release["targetCommitish"]
          if re.fullmatch(r"[0-9a-fA-F]{40}", target):
              assert target.lower() == sha, "Release target SHA mismatch"
          module = ast.parse(pathlib.Path("app/version.py").read_text(encoding="utf-8"))
          version = next(ast.literal_eval(n.value) for n in module.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == "VERSION" for t in n.targets))
          assert release["tagName"] == "v" + version, "Source version and release tag differ"
          release.update(source_sha=sha, expected_version=version, validation_source_sha=os.environ["VALIDATION_SOURCE_SHA"])
          pathlib.Path("release-verification.json").write_text(json.dumps(release, indent=2), encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("EXPECTED_APP_VERSION=" + version + "\n")
          print("Source SHA:", sha, "version:", version, "draft:", release["isDraft"])
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 설치 파일에서 파이썬 · Whisper 꺼내기
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern "Sseudam-Setup.exe" --dir dl
          if ($LASTEXITCODE -ne 0) { throw "설치 파일 다운로드 실패" }
          $hash = (Get-FileHash dl\Sseudam-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($env:EXPECTED_INSTALLER_SHA256 -and $hash -ne $env:EXPECTED_INSTALLER_SHA256.ToLowerInvariant()) { throw "설치 파일 SHA256 불일치" }
          $receipt = Get-Content release-verification.json -Raw | ConvertFrom-Json
          $receipt | Add-Member -NotePropertyName installer_sha256 -NotePropertyValue $hash
          $receipt | ConvertTo-Json | Set-Content release-verification.json -Encoding utf8
          $process = Start-Process -PassThru -Wait -FilePath dl\Sseudam-Setup.exe -ArgumentList "/S"
          if ($process.ExitCode -ne 0) { throw "설치 실패: $($process.ExitCode)" }
          $inst = "$env:LOCALAPPDATA\Programs\Sseudam"
          New-Item -ItemType Directory -Force layout | Out-Null
          Copy-Item "$inst\python" layout\python -Recurse
          Copy-Item "$inst\bin" layout\bin -Recurse
          Copy-Item "$inst\sseudam.ico" layout\ -ErrorAction SilentlyContinue
          # 설치판은 지움 (스토어판과 같은 포트를 쓰지 않게)
          if (Test-Path "$inst\uninstall.exe") { Start-Process -Wait "$inst\uninstall.exe" -ArgumentList "/S" }

      - name: 쓰담 코드 · 스토어 실행기 넣기
        shell: pwsh
        run: |
          robocopy app layout\app /E /XD __pycache__ /XF *.pyc | Out-Null
          if ($LASTEXITCODE -gt 7) { throw "코드 복사 실패 ($LASTEXITCODE)" }
          $global:LASTEXITCODE = 0   # robocopy 는 성공해도 1 을 돌려줌
          Copy-Item windows\launcher.pyw, windows\stop.py, windows\sseudam_launch.py layout\
          Copy-Item 사용설명서.md layout\ -ErrorAction SilentlyContinue
          # 임베디드 파이썬이 묶음 맨 위 폴더의 sseudam_launch 모듈을 찾게
          $pth = Get-ChildItem layout\python\python*._pth | Select-Object -First 1
          Add-Content $pth.FullName ".."
          Get-Content $pth.FullName
          $ver = (Select-String -Path app\version.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value
          "APPVER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: ffmpeg 묶기 (실행 중에 받지 않게)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force layout\bin | Out-Null
          Invoke-WebRequest $env:FFMPEG_URL -OutFile ffmpeg.zip
          Write-Host "ffmpeg sha256: $((Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash)"
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-x
          Get-ChildItem ffmpeg-x -Recurse -Filter ffmpeg.exe | Select-Object -First 1 | Copy-Item -Destination layout\bin\ffmpeg.exe
          Get-ChildItem layout\bin -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: 아이콘 · 묶음 설정
        shell: pwsh
        run: |
          pip install --quiet pillow
          python windows\msix\make_assets.py macos\icon-1024.png layout\Assets
          $v = "$env:APPVER" -replace '[^0-9.]', ''
          $parts = $v.Split('.'); while ($parts.Count -lt 3) { $parts += '0' }
          $version = "$($parts[0]).$($parts[1]).$($parts[2]).0"
          (Get-Content windows\msix\AppxManifest.template.xml -Raw -Encoding utf8).
            Replace('{{NAME}}', $env:MSIX_NAME).Replace('{{PUBLISHER}}', $env:MSIX_PUBLISHER).
            Replace('{{PUBLISHER_NAME}}', $env:MSIX_PUBLISHER_NAME).Replace('{{VERSION}}', $version) |
            Out-File layout\AppxManifest.xml -Encoding utf8
          Get-Content layout\AppxManifest.xml | Select-Object -First 12

      - name: MSIX 만들기
        shell: pwsh
        run: |
          $mk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          "MAKEAPPX=$($mk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGNTOOL=$($st.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $mk.FullName pack /d layout /p "Sseudam-$env:APPVER.msix" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx 실패" }
          Get-Item "Sseudam-$env:APPVER.msix" | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: sseudam-msix-for-store
          path: Sseudam-*.msix

      - name: 시험용 서명 · 설치
        shell: pwsh
        run: |
          Copy-Item "Sseudam-$env:APPVER.msix" test.msix
          $cert = New-SelfSignedCertificate -Type Custom -Subject $env:MSIX_PUBLISHER -KeyUsage DigitalSignature -FriendlyName "sseudam test" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pwd_ = ConvertTo-SecureString -String "test" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath test.pfx -Password $pwd_ | Out-Null
          Export-Certificate -Cert $cert -FilePath test.cer | Out-Null
          Import-Certificate -FilePath test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          & $env:SIGNTOOL sign /fd SHA256 /f test.pfx /p test test.msix
          if ($LASTEXITCODE -ne 0) { throw "시험 서명 실패" }
          Add-AppxPackage -Path test.msix
          $pkg = Get-AppxPackage -Name $env:MSIX_NAME
          if (-not $pkg) { throw "설치 실패" }
          $pkg | Format-List Name, Version, InstallLocation, PackageFamilyName
          "PFN=$($pkg.PackageFamilyName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 시험용 음성 파일
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.SetOutputToWaveFile("$pwd\sample.wav"); $s.Speak("Today Minsu explained the photosynthesis graph very clearly."); $s.Dispose()

      - name: 스토어판 실행하고 핵심 기능 시험 (한 단계 안에서)
        shell: pwsh
        env:
          SETEUK_PORT: "8765"
          SSEUDAM_SMOKE_MSIX: "1"
        run: |
          Start-Process "shell:AppsFolder\$env:PFN!Sseudam"
          for ($i = 0; $i -lt 90; $i++) {
            try { $v = Invoke-RestMethod "http://127.0.0.1:8765/api/version"; Write-Host "켜짐: $($v.version)"; break } catch { Start-Sleep 1 }
          }
          if (-not $v) {
            Get-ChildItem "$env:USERPROFILE\쓰담" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table
            Get-Content "$env:USERPROFILE\쓰담\server.log" -ErrorAction SilentlyContinue
            throw "스토어판이 켜지지 않음"
          }
          if (-not (Test-Path "$env:USERPROFILE\쓰담\data\seteuk.db")) { throw "데이터가 사용자 폴더(쓰담)에 생기지 않음" }
          Write-Host "데이터 폴더 OK: $env:USERPROFILE\쓰담\data"
          python .ci-validation/tools/windows_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 로그
        if: always()
        shell: pwsh
        run: Get-Content "$env:USERPROFILE\쓰담\server.log" -Tail 100 -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msix-smoke-report
          path: |
            smoke-report.txt
            release-verification.json
            output/playwright/windows-help-*.png
