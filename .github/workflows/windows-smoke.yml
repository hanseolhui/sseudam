# 윈도우 실제 PC 시험 — 릴리스의 설치 파일(Sseudam-Setup.exe)을 진짜 윈도우에 깔고 핵심 기능을 돌려 본다.
# 공개 릴리스는 자동 시험. 공개 전에는 draft 태그 + 정확한 소스 SHA/설치 파일 SHA256으로 수동 시험.
name: windows-smoke
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "시험할 릴리스 태그 (draft도 가능, 비우면 최신 공개 릴리스)"
        required: false
        type: string
      source_sha:
        description: "검증할 소스의 전체 commit SHA (draft 시험은 필수)"
        required: false
        type: string
      installer_sha256:
        description: "Sseudam-Setup.exe SHA256 (draft 시험은 필수)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-smoke-${{ github.event.inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: windows-latest
    # GitHub는 push 권한이 있는 토큰에만 draft 릴리스를 보여 준다.
    # 토큰은 릴리스 조회·다운로드 단계에만 전달하고 체크아웃에 저장하지 않는다.
    permissions:
      contents: write
    timeout-minutes: 40
    env:
      SETEUK_DATA: ${{ github.workspace }}\testdata
      SETEUK_PORT: "8790"
      SETEUK_NO_BROWSER: "1"
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      REQUESTED_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
      EXPECTED_SOURCE_SHA: ${{ github.event.inputs.source_sha }}
      VALIDATION_SOURCE_SHA: ${{ github.sha }}
      EXPECTED_INSTALLER_SHA256: ${{ github.event.inputs.installer_sha256 }}
    steps:
      - name: 공개 또는 draft 릴리스와 검증 소스 지정
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:REQUESTED_TAG -and $env:REQUESTED_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "릴리스 태그 형식이 올바르지 않음" }
          if ($env:EXPECTED_SOURCE_SHA -and $env:EXPECTED_SOURCE_SHA -notmatch '^[0-9a-fA-F]{40}$') { throw "전체 소스 SHA가 필요함" }
          if ($env:EXPECTED_INSTALLER_SHA256 -and $env:EXPECTED_INSTALLER_SHA256 -notmatch '^[0-9a-fA-F]{64}$') { throw "설치 파일 SHA256 형식이 올바르지 않음" }
          $releaseArgs = @("release", "view", "--repo", $env:GITHUB_REPOSITORY, "--json", "tagName,isDraft,targetCommitish,url")
          if ($env:REQUESTED_TAG) { $releaseArgs += $env:REQUESTED_TAG }
          $raw = & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw "릴리스 정보를 읽지 못함" }
          $release = $raw | ConvertFrom-Json
          if ($release.tagName -notmatch '^v\d+\.\d+\.\d+$') { throw "릴리스 태그 형식이 올바르지 않음" }
          if ($release.isDraft -and (-not $env:EXPECTED_SOURCE_SHA -or -not $env:EXPECTED_INSTALLER_SHA256)) {
            throw "draft 검증은 source_sha와 installer_sha256을 모두 지정해야 함"
          }
          $source = if ($env:EXPECTED_SOURCE_SHA) { $env:EXPECTED_SOURCE_SHA } else { $release.tagName }
          "source=$source" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "RELEASE_TAG=$($release.tagName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $release | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\release-verification.json" -Encoding utf8

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.source }}
          persist-credentials: false

      # 앱 소스는 릴리스 SHA에 고정하고, 시험 도구는 이번 workflow commit을 사용한다.
      # 캡처/검증 도구만 수정했을 때 이미 만든 릴리스 태그를 바꾸지 않기 위함이다.
      - name: 현재 검증 도구 가져오기
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ci-validation
          sparse-checkout: tools
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Windows Edge 화면 검증 도구 준비
        run: python -m pip install playwright

      - name: 소스 SHA와 릴리스 버전 확인
        shell: pwsh
        run: |
          @'
          import ast, json, os, pathlib, re, subprocess
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          expected = os.environ.get("EXPECTED_SOURCE_SHA", "")
          assert not expected or sha == expected.lower(), "Source SHA mismatch"
          release = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "release-verification.json").read_text(encoding="utf-8-sig"))
          target = release["targetCommitish"]
          if re.fullmatch(r"[0-9a-fA-F]{40}", target):
              assert target.lower() == sha, "Release target SHA mismatch"
          module = ast.parse(pathlib.Path("app/version.py").read_text(encoding="utf-8"))
          version = next(ast.literal_eval(n.value) for n in module.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == "VERSION" for t in n.targets))
          assert release["tagName"] == "v" + version, "Source version and release tag differ"
          release.update(source_sha=sha, expected_version=version, validation_source_sha=os.environ["VALIDATION_SOURCE_SHA"])
          pathlib.Path("release-verification.json").write_text(json.dumps(release, indent=2), encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("EXPECTED_APP_VERSION=" + version + "\n")
          print("Source SHA:", sha, "version:", version, "draft:", release["isDraft"])
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows 합성 파일의 경로·핸들 식별 정보 진단
        shell: pwsh
        run: |
          @'
          import json, os, pathlib, sys, tempfile, time
          fields = ("st_ino", "st_dev", "st_size", "st_mtime_ns", "st_ctime_ns", "st_birthtime_ns")
          def values(info):
              return {field: getattr(info, field, None) for field in fields}
          result = {"python": sys.version, "platform": sys.platform, "cases": []}
          with tempfile.TemporaryDirectory(prefix="sseudam-stat-diagnostic-") as temporary:
              path = pathlib.Path(temporary) / "synthetic.wav"
              for index, content in enumerate((b"synthetic-audio-A", b"synthetic-audio-B-longer")):
                  if index:
                      time.sleep(0.1)  # NTFS의 생성 시각과 변경 시각이 같은 tick이 되지 않게 한다.
                  path.write_bytes(content)
                  before = os.lstat(path)
                  with path.open("rb") as source:
                      opened = os.fstat(source.fileno())
                      source.read()
                      after = os.fstat(source.fileno())
                  result["cases"].append({"lstat_before": values(before), "fstat_opened": values(opened),
                                          "fstat_after": values(after), "lstat_after": values(os.lstat(path)),
                                          "same_file": os.path.samestat(before, opened)})
          pathlib.Path("windows-stat-diagnostic.json").write_text(json.dumps(result, indent=2), encoding="utf-8")
          print(json.dumps(result))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 전체 Python 시험 (백업 · 음성 · 클라우드 통합 포함)
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v *> source-tests.log
          $code = $LASTEXITCODE
          Get-Content source-tests.log
          if ($code -ne 0) { exit $code }

      - name: 설치 파일 받기
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern "Sseudam-Setup.exe" --dir dl
          if ($LASTEXITCODE -ne 0) { throw "설치 파일 다운로드 실패" }
          $hash = (Get-FileHash dl\Sseudam-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($env:EXPECTED_INSTALLER_SHA256 -and $hash -ne $env:EXPECTED_INSTALLER_SHA256.ToLowerInvariant()) { throw "설치 파일 SHA256 불일치" }
          $receipt = Get-Content release-verification.json -Raw | ConvertFrom-Json
          $receipt | Add-Member -NotePropertyName installer_sha256 -NotePropertyValue $hash
          $receipt | ConvertTo-Json | Set-Content release-verification.json -Encoding utf8
          Get-Item dl\Sseudam-Setup.exe | Format-List Name, Length
          Write-Host "Installer SHA256: $hash"

      - name: 이전 공개 버전 설치 · 합성 기록과 백업 설정 준비
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $raw = gh release list --repo $env:GITHUB_REPOSITORY --limit 30 --json tagName,isDraft,isPrerelease
          if ($LASTEXITCODE -ne 0) { throw "이전 릴리스 조회 실패" }
          $target = [version]($env:RELEASE_TAG.Substring(1))
          $previous = ($raw | ConvertFrom-Json) | Where-Object { -not $_.isDraft -and -not $_.isPrerelease -and $_.tagName -match '^v\d+\.\d+\.\d+$' -and [version]($_.tagName.Substring(1)) -lt $target } | Sort-Object { [version]($_.tagName.Substring(1)) } -Descending | Select-Object -First 1
          if (-not $previous) { throw "업그레이드 기준 공개 버전이 없음" }
          gh release download $previous.tagName --repo $env:GITHUB_REPOSITORY --pattern "Sseudam-Setup.exe" --dir dl-previous
          if ($LASTEXITCODE -ne 0) { throw "이전 설치 파일 다운로드 실패" }
          $process = Start-Process -Wait -PassThru dl-previous\Sseudam-Setup.exe -ArgumentList "/S"
          if ($process.ExitCode -ne 0) { throw "이전 버전 설치 실패" }
          $inst = "$env:LOCALAPPDATA\Programs\Sseudam"
          $oldVersion = $previous.tagName.Substring(1)
          $env:SETEUK_DATA = "$env:GITHUB_WORKSPACE\upgrade-testdata"
          $env:SETEUK_BIN = "$inst\bin"
          & "$inst\python\python.exe" .ci-validation/tools/windows_upgrade_smoke.py prepare --installed $inst --version $oldVersion
          if ($LASTEXITCODE -ne 0) { throw "이전 버전 합성 자료 준비 실패" }
          $server = Start-Process -PassThru "$inst\python\python.exe" -ArgumentList "`"$inst\app\server.py`"" -RedirectStandardOutput upgrade-before.log -RedirectStandardError upgrade-before.err
          try {
            $v = $null
            for ($i = 0; $i -lt 60; $i++) { try { $v = Invoke-RestMethod "http://127.0.0.1:8790/api/version"; break } catch { Start-Sleep 1 } }
            if (-not $v) { throw "이전 설치 앱 실행 실패" }
            python .ci-validation/tools/windows_upgrade_smoke.py capture --installed $inst --version $oldVersion
            if ($LASTEXITCODE -ne 0) { throw "실행 중인 이전 앱의 기준 자료 확인 실패" }
          } finally {
            try { Invoke-RestMethod "http://127.0.0.1:8790/api/shutdown" -Method Post -Headers @{"X-Seteuk"="1"} -ContentType "application/json" -Body "{}" | Out-Null } catch {}
            if (-not $server.WaitForExit(10000)) { Stop-Process -Id $server.Id -Force; throw "이전 시험 서버가 종료되지 않음" }
          }

      - name: 새 버전 덮어설치 (관리자 권한 없이)
        shell: pwsh
        run: |
          $process = Start-Process -Wait -PassThru -FilePath dl\Sseudam-Setup.exe -ArgumentList "/S"
          if ($process.ExitCode -ne 0) { throw "설치 프로그램 종료 코드: $($process.ExitCode)" }
          $inst = "$env:LOCALAPPDATA\Programs\Sseudam"
          if (-not (Test-Path "$inst\python\pythonw.exe")) { throw "설치 실패: $inst 에 파이썬이 없음" }
          if (-not (Test-Path "$inst\app\server.py")) { throw "설치 실패: 앱 코드가 없음" }
          "INST=$inst" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem $inst | Format-Table Name

      - name: 설치된 코드가 검증 소스와 같은지 확인
        shell: pwsh
        run: |
          @'
          import hashlib, json, os, pathlib, subprocess
          installed = pathlib.Path(os.environ["INST"])
          tracked = subprocess.check_output(["git", "ls-files", "-z", "app"]).decode("utf-8").split("\0")
          tracked = [name for name in tracked if name]
          pairs = [(name, name) for name in tracked]
          pairs += [("windows/launcher.pyw", "launcher.pyw"), ("windows/stop.py", "stop.py")]
          checked = []
          for source, destination in pairs:
              # Git blob 비교는 Windows 체크아웃의 줄바꿈 변환에 영향받지 않는다.
              expected = subprocess.check_output(["git", "show", "HEAD:" + source])
              actual = (installed / destination).read_bytes()
              assert actual == expected, "Installed source differs: " + destination
              checked.append({"path": destination, "sha256": hashlib.sha256(actual).hexdigest()})
          actual_names = {p.relative_to(installed).as_posix() for p in (installed / "app").rglob("*") if p.is_file() and "__pycache__" not in p.parts and p.suffix != ".pyc"}
          assert actual_names == set(tracked), "Unexpected or missing installed app files"
          receipt_path = pathlib.Path("release-verification.json")
          receipt = json.loads(receipt_path.read_text(encoding="utf-8-sig"))
          receipt.update(installed_source_matches=True, installed_files=checked)
          receipt_path.write_text(json.dumps(receipt, ensure_ascii=False, indent=2), encoding="utf-8")
          print("Installed source files matched:", len(checked))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 업그레이드 후 기록 · 음성 · 백업 설정 보존 확인
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:SETEUK_DATA = "$env:GITHUB_WORKSPACE\upgrade-testdata"
          $env:SETEUK_BIN = "$env:INST\bin"
          $server = Start-Process -PassThru "$env:INST\python\python.exe" -ArgumentList "`"$env:INST\app\server.py`"" -RedirectStandardOutput upgrade-after.log -RedirectStandardError upgrade-after.err
          try {
            $v = $null
            for ($i = 0; $i -lt 60; $i++) { try { $v = Invoke-RestMethod "http://127.0.0.1:8790/api/version"; break } catch { Start-Sleep 1 } }
            if (-not $v) { throw "새 설치 앱 실행 실패" }
            python .ci-validation/tools/windows_upgrade_smoke.py verify --installed $env:INST --version $env:EXPECTED_APP_VERSION
            if ($LASTEXITCODE -ne 0) { throw "업그레이드 보존 시험 실패" }
          } finally {
            try { Invoke-RestMethod "http://127.0.0.1:8790/api/shutdown" -Method Post -Headers @{"X-Seteuk"="1"} -ContentType "application/json" -Body "{}" | Out-Null } catch {}
            if (-not $server.WaitForExit(10000)) { Stop-Process -Id $server.Id -Force; throw "업그레이드 시험 서버가 종료되지 않음" }
          }

      - name: 시험용 음성 파일 만들기
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.SetOutputToWaveFile("$pwd\sample.wav")
          $s.Speak("Today Minsu explained the photosynthesis graph very clearly.")
          $s.Dispose()
          Get-Item sample.wav | Format-List Name, Length

      - name: 쓰담 서버 켜고 핵심 기능 시험 (한 단계 안에서)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:SETEUK_DATA | Out-Null
          # 실행기(launcher.pyw)가 넣는 것과 같은 환경
          $env:SETEUK_APP = "1"; $env:SETEUK_BIN = "$env:INST\bin"; $env:PYTHONUTF8 = "1"
          "SETEUK_BIN=$env:INST\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Start-Process -FilePath "$env:INST\python\python.exe" -ArgumentList "`"$env:INST\app\server.py`"" -RedirectStandardOutput server.log -RedirectStandardError server.err
          for ($i = 0; $i -lt 60; $i++) {
            try { $v = Invoke-RestMethod "http://127.0.0.1:8790/api/version"; Write-Host "켜짐: $($v.version)"; break } catch { Start-Sleep 1 }
          }
          if (-not $v) { Get-Content server.log, server.err; throw "서버가 켜지지 않음" }
          if ($v.version -ne $env:EXPECTED_APP_VERSION) { throw "실행 중인 앱 버전 불일치: $($v.version)" }
          python .ci-validation/tools/windows_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 로그
        if: always()
        shell: pwsh
        run: |
          if (Test-Path server.log) { Get-Content server.log -Tail 80 }
          if (Test-Path server.err) { Get-Content server.err -Tail 80 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke-logs
          path: |
            server.log
            server.err
            smoke-report.txt
            source-tests.log
            release-verification.json
            windows-stat-diagnostic.json
            windows-upgrade-report.json
            upgrade-baseline.json
            upgrade-before.log
            upgrade-before.err
            upgrade-after.log
            upgrade-after.err
            output/playwright/windows-help-*.png
