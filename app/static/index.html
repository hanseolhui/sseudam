<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쓰담</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/icon-192.png" media="(prefers-color-scheme: light)">
<link rel="icon" href="/icon-dark-192.png" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#FFE08A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14172E" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
</head>
<body>
<a class="skip-link" href="#view">본문으로 건너뛰기</a>
<div class="layout">
  <aside class="sidebar" aria-label="메뉴">
    <a class="brand" href="#/" data-home="1" aria-label="쓰담 홈으로">
      <svg class="mascot logo-mark" viewBox="0 0 1024 1024" aria-hidden="true" focusable="false">
        <rect width="1024" height="1024" rx="230" fill="#FFE08A"/>
        <g stroke="#2E3A8C" stroke-width="56" stroke-linecap="round" fill="none"><line x1="250" y1="440" x2="250" y2="584"/><line x1="330" y1="372" x2="330" y2="652"/><line x1="410" y1="420" x2="410" y2="604"/><path d="M490 400h230"/><path d="M490 512h290"/><path d="M490 624h180"/></g>
        <circle cx="780" cy="624" r="34" fill="#FF7A6B"/>
      </svg>
      <span class="brand-text">쓰담<small>말로 담고, 글로 씁니다</small></span>
    </a>
    <button class="search-trigger" id="search-open" type="button" aria-label="검색 열기 (⌘K)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>학생·기록 검색</span><kbd id="search-kbd">⌘K</kbd>
    </button>
    <label class="term-switch" title="학기 바꾸기">
      <span class="sr-only">보고 있는 학기</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="4"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
      <select id="term-select" aria-label="보고 있는 학기"></select>
    </label>
    <nav aria-label="주 메뉴">
      <a href="#/" data-nav="dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-5H9v5H5.5A1.5 1.5 0 0 1 4 19z"/></svg><span>홈</span></a>
      <a href="#/recordings" data-nav="recordings"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M6 11.5a6 6 0 0 0 12 0M12 17.5V20.5"/></svg><span>녹음함</span> <span id="nav-pending" class="pill hidden"></span></a>
      <a href="#/classes" data-nav="classes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="8" r="2.4"/><path d="M15.8 13.3c2.4-.3 4.3 1.2 4.7 4.2"/></svg><span>학급·학생</span></a>
      <a href="#/drafts" data-nav="drafts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4.5 19.5 9.5 9 20H4v-5z"/><path d="M12.5 6.5l5 5"/></svg><span>초안 작성</span></a>
      <a href="#/prompts" data-nav="prompts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5h-8l-4.5 3.5v-3.5H5A1.5 1.5 0 0 1 3.5 15V7A1.5 1.5 0 0 1 5 5.5z"/><path d="M8 10h8M8 13h5"/></svg><span>프롬프트 안내</span></a>
      <a href="#/archive" data-nav="archive"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="4.5" rx="1.5"/><path d="M5 9v9a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 18V9M10 13h4"/></svg><span>지난 학기</span></a>
      <a href="#/trash" data-nav="trash"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M9.5 7V5h5v2M6.5 7l.8 12a1.5 1.5 0 0 0 1.5 1.4h6.4a1.5 1.5 0 0 0 1.5-1.4l.8-12"/></svg><span>휴지통</span></a>
      <a href="#/settings" data-nav="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M20.5 12h-2.2M5.7 12H3.5M18 6l-1.6 1.6M7.6 16.4 6 18M18 18l-1.6-1.6M7.6 7.6 6 6"/></svg><span>설정</span></a>
    </nav>
    <div class="sidebar-foot">
      <div id="mode-badge" class="mode-badge"></div>
      <div id="ver-badge" class="mode-badge"></div>
      <button class="link" id="btn-quit" type="button">프로그램 종료</button>
    </div>
  </aside>
  <div class="main-col">
    <div id="update-banner" class="update-banner hidden"></div>
    <div id="plus-banner" class="update-banner hidden"></div>
    <div id="term-banner" class="term-banner hidden" role="status"></div>
    <a id="menu-home" class="menu-home hidden" href="#/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-5H9v5H5.5A1.5 1.5 0 0 1 4 19z"/></svg><span></span></a>
    <main id="view" class="main" tabindex="-1"></main>
  </div>
</div>

<button id="jobs-fab" class="jobs-fab hidden" type="button"></button>
<div id="jobs-panel" class="jobs-panel hidden"></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box" role="dialog" aria-modal="true"></div></div>
<div id="search" class="search-overlay hidden">
  <div class="search-box" role="dialog" aria-modal="true" aria-label="검색">
    <div class="search-input">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search-q" type="search" placeholder="학생 이름, 기록 내용, 녹음 제목…" autocomplete="off" aria-label="검색어" aria-controls="search-results">
      <kbd>esc</kbd>
    </div>
    <div id="search-results" class="search-results" role="listbox" aria-label="검색 결과"></div>
  </div>
</div>

<script src="/vendor/qrcode.js"></script>
<script src="/app.js"></script>
</body>
</html>
